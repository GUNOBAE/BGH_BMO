<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="bmo-command-token" content="__COMMAND_TOKEN__">
<title>BMO 기능 통합</title><link rel="stylesheet" href="/feature.css">
<script src="/adapter.js" defer></script><script src="/feature.js" defer></script></head>
<body><button id="controls-toggle" aria-expanded="true" aria-controls="shell-header shell-footer">메뉴 숨기기</button><header id="shell-header"><strong>BMO</strong><span id="simulation">연결 확인 중</span>
<button id="face-button" data-intent="return_to_face">얼굴</button>
<button id="games-button" data-intent="open_game_menu">게임</button>
<button id="photo-button" data-intent="take_photo">사진</button>
<button id="track-button" data-intent="start_face_tracking">얼굴 위치 추적</button>
<button id="camera-off" data-intent="stop_face_tracking">카메라 끄기</button>
<button id="stop-button" data-control="stop">정지</button></header>
<main><section id="face-panel"><iframe id="face" title="보존된 BMO 얼굴" src="/face.html?kiosk=1"></iframe></section>
<section id="game-menu" class="panel" hidden><h1>게임 목록</h1><p>모의 자료만 제공됩니다. 실제 게임팩은 준비 중입니다.</p><div id="game-list"></div><button data-intent="return_to_face">BMO로 돌아가기</button></section>
<section id="game-panel" class="panel" hidden><h1 id="game-title">모의 게임</h1><iframe id="game-frame" title="격리된 모의 게임" sandbox="allow-scripts"></iframe><p>게임 중 B는 게임 입력입니다. Esc 또는 Start+Select 1.2초 유지로 목록에 복귀합니다. 종료하면 진행 상황이 유실됩니다.</p><button data-intent="exit_game">게임 종료 → 목록</button></section>
<section id="photo-panel" class="panel" hidden><h1>모의 사진</h1><p id="photo-status"></p><img id="photo-result" alt="합성 사진 결과" hidden><button data-intent="take_photo">다시 찍기</button><button data-intent="return_to_face">얼굴 복귀</button></section>
<section id="music-panel" class="panel" hidden><h1>모의 미디어</h1><p id="media-status"></p><button data-control="pause">일시 정지</button><button data-control="resume">재개</button><button data-control="next">다음 곡</button><button data-intent="stop_media">정지·얼굴 복귀</button></section>
</main><aside id="preview-panel" hidden><span>합성 프리뷰 · 실제 카메라 아님</span><img id="preview" alt="합성 카메라 프리뷰"></aside>
<footer id="shell-footer"><div id="status" role="status"></div><div id="result" aria-live="polite"></div>
<button id="talk-button" data-control="question">가상 질문</button><button data-control="cancel">취소</button><button id="repeat-button" data-control="repeat">다시 듣기</button><button data-control="reset">초기화</button><button id="preview-button">프리뷰 켜기/끄기</button>
<label>표정<select id="emotion"><option>auto</option><option>crying</option><option>happy</option><option>sad</option><option>surprised</option><option>angry</option><option>neutral</option><option>manual</option></select></label>
<label>모의 노래<select id="songs"></select></label><button id="song-play">선택 곡 재생</button>
<div id="pad"><span>가상 입력</span><button data-key="UP">↑</button><button data-key="DOWN">↓</button><button data-key="LEFT">←</button><button data-key="RIGHT">→</button><button data-key="A">A</button><button data-key="B">B</button><button data-key="START">Start</button><button data-key="SELECT">Select</button><button data-key="ESC">Esc</button></div>
<p id="health">실제 패드 매핑·게임팩·노래·센서 건강은 미검수입니다.</p></footer></body></html>
