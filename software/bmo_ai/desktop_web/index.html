<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="bmo-command-token" content="__COMMAND_TOKEN__">
<title>BMO</title><link rel="stylesheet" href="/desktop.css">
<script src="/adapter.js" defer></script><script src="/desktop.js" defer></script></head>
<body><main><iframe id="face" title="BMO" src="/face.html?kiosk=1"></iframe></main>
<section id="splash" aria-live="polite"><h1>BMO Loading...</h1><div id="progress-percent" aria-hidden="true">10%</div><div id="progress-track" role="progressbar" aria-label="BMO 시작 준비" aria-valuemin="0" aria-valuemax="100" aria-valuenow="10"><div id="progress-fill"></div></div><p id="loading-stage">시작 준비 중...</p></section>
<section id="notice" role="status" hidden><span id="notice-message"></span><button id="notice-menu">메뉴</button></section>
<dialog id="menu"><h2>BMO</h2><button id="talk">한 번 듣기</button><button id="repeat">다시 듣기</button>
<button id="stop">정지</button><button id="games">게임 목록</button><button id="greeting-retry">인사 캐시 재시도</button>
<button id="camera-menu">사진·시선</button><button id="video-menu">별도 영상 녹화</button><button id="music-menu">음악</button><button id="system-menu">준비 상태</button>
<button id="resume">얼굴로 돌아가기</button><button id="exit">종료</button><p id="diagnostic"></p></dialog>
<dialog id="game-menu"><h2>게임 목록</h2><div id="game-list"></div><button id="game-back">얼굴로 돌아가기</button></dialog>
<dialog id="camera-dialog"><h2>사진·시선</h2><p id="camera-readiness"></p><button id="photo-take">사진 촬영</button><button id="camera-preview">미리보기 켜기</button><button id="camera-track">얼굴 위치 시선 켜기</button><button id="camera-off">카메라 끄기</button><img id="camera-image" alt="요청한 카메라 미리보기" hidden><button class="dialog-close">얼굴로 돌아가기</button></dialog>
<dialog id="video-dialog"><h2>별도 영상 녹화</h2><p id="video-readiness"></p><p id="video-explanation">음성 녹음과 별개이며 소리를 저장하지 않아요. 현재 실물 카메라는 꺼져 있어요.</p><label><input id="video-consent" type="checkbox">선택한 저장 위치에 모의 영상을 만드는 데 동의해요.</label><button id="video-start" disabled>모의 영상 시작</button><button id="video-stop" disabled>영상 저장·종료</button><p id="video-result" role="status"></p><a id="video-download" hidden download>검증된 모의 영상 파일</a><button class="dialog-close">얼굴로 돌아가기</button></dialog>
<dialog id="music-dialog"><h2>음악</h2><p id="music-readiness"></p><div id="music-list"></div><button id="music-pause">일시 정지</button><button id="music-resume">이어서</button><button id="music-next">다음</button><button id="music-stop">음악 종료·얼굴 복귀</button><button class="dialog-close">얼굴로 돌아가기</button></dialog>
<dialog id="system-dialog"><h2>준비 상태</h2><p id="system-readiness"></p><p>GP8 Enter의 실물 매핑은 사용자 검수가 필요해요. GP7 빨간 버튼과 팔·IMU 설정은 보존했어요.</p><pre id="turn-diagnostics" aria-label="원문 없는 대화 단계 진단"></pre><pre id="input-evidence" aria-label="Enter 입력 수신 확인"></pre><button class="dialog-close">얼굴로 돌아가기</button></dialog>
<section id="foreground" hidden><p id="foreground-status"></p><img id="photo-result-image" alt="직접 요청한 촬영 결과" style="max-width:60vw;max-height:60vh" hidden><a id="photo-download" download hidden>사진 저장</a><button id="foreground-back">얼굴로 돌아가기</button></section>
<span id="video-indicator" role="status" hidden></span><span id="ptt-state" role="status" hidden></span><span id="status" hidden></span></body></html>
